<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    path { stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .wing { fill: #111; }
    .body { fill: none; }
    @media (prefers-color-scheme: dark) { path { stroke: #f2f2f2; } .wing { fill: #f2f2f2; } }
  </style>
  <!-- paper airplane: outline, plus the lower wing filled in so it reads at tab size -->
  <path class="body" d="M29 3 L3 13.5 L13.5 18.5 L18.5 29 Z"/>
  <path class="wing" d="M29 3 L13.5 18.5 L18.5 29 Z"/>
</svg>
