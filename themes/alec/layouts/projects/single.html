{{ define "main" }}
<nav class="navbar">
    <a href="/">← Back</a>
    <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" style="width:44px;height:44px;border:2px solid var(--border-mid);border-radius:6px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;transition:background 0.2s;">
        <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" style="width:32px;height:32px;min-width:32px;min-height:32px;display:block;stroke:var(--icon);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" style="width:32px;height:32px;min-width:32px;min-height:32px;display:none;stroke:var(--icon);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>
</nav>
<article class="content">
    <header class="review-header">
        <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:0.5rem;">
            <h1 class="post-title" style="margin-bottom:0;">{{ .Title }}</h1>
            {{ with .Params.badge }}<span class="project-badge" style="font-size:0.75rem;padding:3px 9px;">{{ . }}</span>{{ end }}
        </div>
        {{ with .Params.external_link }}
        <a href="{{ . }}" target="_blank" style="font-size:0.85rem;color:var(--text-muted);text-decoration:underline;text-underline-offset:3px;">{{ . }} ↗</a>
        {{ end }}
    </header>
    <div class="review-content">{{ .Content }}</div>
    <a href="/" class="back-link">← Back</a>
</article>
{{ end }}

{{ define "scripts" }}
<script>
const toggle = document.getElementById('themeToggle');
const moon = document.getElementById('iconMoon');
const sun = document.getElementById('iconSun');
if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme','dark');
    moon.style.display = 'none'; sun.style.display = 'block';
}
toggle.addEventListener('click', () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','light'); moon.style.display='block'; sun.style.display='none'; }
    else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); moon.style.display='none'; sun.style.display='block'; }
});
</script>
{{ end }}
